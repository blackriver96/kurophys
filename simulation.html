<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シミュレーション - くろこーの物理の部屋</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ナビ -->
  <nav class="navbar">
    <div class="nav-container">
      <div class="logo">くろこーの物理の部屋</div>
      <button class="nav-toggle" aria-label="メニュー" aria-expanded="false" aria-controls="nav-menu">
        <span class="hamburger"></span>
      </button>
      <ul class="nav-menu" id="nav-menu">
        <li><a href="index.html">ホーム</a></li>
        <li><a href="lecture.html">講義資料</a></li>
        <li><a href="notes.html">物理虎の巻</a></li>
        <li><a href="videos.html">動画</a></li>
        <li><a href="links.html">リンク集</a></li>
        <li><a href="teachers.html">先生方へ</a></li>
        <li><a href="simulation.html">シミュレーション</a></li>
      </ul>
    </div>
  </nav>

  <header class="page-header">
    <h1>シミュレーション</h1>
    <p>物理の現象を視覚的に学べるシミュレーションを順次公開します。</p>
  </header>

  <main class="container">
    <section class="about">
      <h2>準備中</h2>
      <p>現在、シミュレーションページは準備中です。簡単なブラウザ内シミュレーションや外部埋め込みを順次追加していきます。</p>
      <p>リクエストがあれば作ってほしいシミュレーション（例：弾道、単振動、電場・磁場の可視化）を教えてください。</p>
      <p><a href="index.html" class="btn">ホームに戻る</a></p>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2026 くろこーの物理の部屋. All rights reserved.</p>
  </footer>

<script>
  (function(){
    document.addEventListener('DOMContentLoaded', function(){
      const toggle = document.querySelector('.nav-toggle');
      const menu = document.getElementById('nav-menu');
      if (!toggle || !menu) return;
      toggle.addEventListener('click', ()=> {
        const expanded = toggle.getAttribute('aria-expanded') === 'true';
        toggle.setAttribute('aria-expanded', String(!expanded));
        menu.classList.toggle('open');
      });
      menu.querySelectorAll('a').forEach(a=>a.addEventListener('click', ()=> {
        if (menu.classList.contains('open')) {
          menu.classList.remove('open');
          toggle.setAttribute('aria-expanded', 'false');
        }
      }));
    });
  })();
</script>
</body>
</html>
